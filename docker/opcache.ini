; Dev container tuning. The app runs under "artisan serve" (the CLI SAPI) on a Windows bind mount, where
; recompiling the framework on every request costs seconds. Keeping compiled code in opcache fixes that.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Notices PHP edits within a minute; re-checking every file is what costs ~1.8 ms each on the bind mount.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
